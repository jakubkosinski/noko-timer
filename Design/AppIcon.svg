<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FBF71"/>
      <stop offset="1" stop-color="#159A9C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- timer arc: 12 o'clock to ~4 o'clock, clockwise -->
  <path d="M 512 177 A 335 335 0 0 1 802.1 679.5" fill="none" stroke="#FF8A3D" stroke-width="34" stroke-linecap="round"/>
  <!-- face -->
  <circle cx="512" cy="512" r="290" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="290" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="6"/>
  <!-- ticks -->
  <g stroke="#1F2A37" stroke-linecap="round">
    <g stroke-width="26">
      <line x1="512" y1="250" x2="512" y2="282"/>
      <line x1="512" y1="250" x2="512" y2="282" transform="rotate(90 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="282" transform="rotate(180 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="282" transform="rotate(270 512 512)"/>
    </g>
    <g stroke-width="14" stroke-opacity="0.55">
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(30 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(60 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(120 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(150 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(210 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(240 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(300 512 512)"/>
      <line x1="512" y1="250" x2="512" y2="268" transform="rotate(330 512 512)"/>
    </g>
    <!-- hands: ~10:10 -->
    <line x1="512" y1="512" x2="512" y2="372" stroke-width="32" transform="rotate(305 512 512)"/>
    <line x1="512" y1="512" x2="512" y2="310" stroke-width="26" transform="rotate(60 512 512)"/>
  </g>
  <circle cx="512" cy="512" r="26" fill="#1F2A37"/>
  <circle cx="512" cy="512" r="10" fill="#FF8A3D"/>
</svg>
